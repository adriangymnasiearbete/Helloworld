<!DOCTYPE html>
<html lang="en">
<head>
  <title>Hello World</title>
  <button id="startCapture">Capture Screen</button>
  <meta name="description" content="A simple and fast Progressive Web App.">

  <link rel="manifest" href="/Helloworld/mypwa.json">

  <style>
    h1 {
      color: magenta;
      font-size: 5vw;
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode',
                   'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }
  </style>
</head>

<body>
  <main>
    <h1>Hello World!</h1>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("Service worker registered"))
          .catch(error => console.error("Service worker failed:", error));
      });
    }
  </script>

</body>
</html>
