<!DOCTYPE html>
<html lang="en">
<head>
  <title>Hello World</title>

  <meta name="description" content="A simple and fast Progressive Web App.">

  <link rel="manifest" href="/Helloworld/mypwa.json">

  <style>
    h1 {
      color: magenta;
      font-size: 5vw;
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode',
                   'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }
  </style>
</head>

<body>
  <main>
    <h1>Hello World!</h1>
    <button id="startCapture">Capture Screen</button>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("Service worker registered"))
          .catch(error => console.error("Service worker failed:", error));
      });
    }
  </script>
  <script>
    const startCaptureButton = document.getElementById("startCapture");

    startCaptureButton.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        console.log("Screen capture started!");

        const video = document.createElement("video");
        video.srcObject = stream;
        video.autoplay = true;
        video.controls = true;
        video.style.width = "80%";
        video.style.display = "block";
        video.style.marginTop = "20px";

        document.body.appendChild(video);

      } catch (error) {
        console.error("Screen capture failed:", error);
      }
    });
  </script>
  
</body>
</html>
